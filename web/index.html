<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="local-token" content="__LOCAL_TOKEN__" />
    <title>有得看</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/app.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" data-i18n="brand">有得看</div>
      <nav class="view-switch" id="view-switch" aria-label="视图">
        <button class="view-button active" data-view="stream" data-i18n="viewStream">刷流</button>
        <button class="view-button" data-view="saved" data-i18n="viewSaved">收藏夹</button>
        <button class="view-button" data-view="library" data-i18n="viewLibrary">资料库</button>
        <button class="view-button" data-view="today" data-i18n="viewToday">今天刷过</button>
      </nav>
      <label class="search"><span class="sr-only" data-i18n="search">搜索</span><input id="query" data-i18n-placeholder="searchPlaceholder" placeholder="搜索文章" /></label>
      <details class="tools-menu" id="tools-menu">
        <summary class="tools-trigger" data-i18n-title="moreTools" data-i18n-aria-label="moreTools" title="更多工具" aria-label="更多工具">⋯</summary>
        <div class="tools-panel" id="tools-panel">
          <button type="button" id="refresh" class="tool-button"><span class="tool-icon">↻</span><span data-i18n="refreshAction">刷新文章</span></button>
          <button type="button" id="import" class="tool-button"><span class="tool-icon">⇧</span><span data-i18n="importAction">导入文章</span></button>
          <button type="button" id="backup" class="tool-button"><span class="tool-icon">⤓</span><span data-i18n="backupAction">完整备份</span></button>
          <button type="button" id="theme" class="tool-button"><span class="tool-icon">◐</span><span data-i18n="themeAction">切换深色模式</span></button>
          <button type="button" id="language" class="tool-button"><span class="tool-icon" id="language-code">EN</span><span data-i18n="languageAction">切换语言</span></button>
        </div>
      </details>
      <span id="debug-info" class="debug-info" hidden></span>
    </header>
    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <h2 data-i18n="library">资料库</h2>
        <button class="filter active" data-status="all" data-i18n="all">全部文章</button>
        <button class="filter" data-status="unread" data-i18n="unread">未读</button>
        <button class="filter" data-status="saved" data-i18n="saved">已收藏</button>
        <button class="filter" data-status="archived" data-i18n="archived">已归档</button>
        <h2 class="source-heading" data-i18n="sources">来源</h2>
        <button class="source active" data-source="" data-i18n="allSources">全部来源</button>
        <div id="sources"></div>
        <button id="add-source" class="add-source" data-i18n="addSource">+ 添加来源</button>
        <p id="sync-status" class="sync-status" role="status">正在检查更新…</p>
        <p id="backup-status" class="backup-status" role="status"></p>
        <p id="cleanup-status" class="backup-status" role="status"></p>
      </aside>
      <div class="sash" data-sash="sidebar" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="resizeSidebar" data-i18n-title="resizeSidebar" aria-label="拖动调整资料库宽度，双击恢复默认" title="拖动调整资料库宽度，双击恢复默认"></div>
      <section class="feed-pane">
        <div class="pane-heading"><h1 id="feed-title">最新文章</h1><span id="count"></span></div>
        <div id="saved-filters" class="saved-filters" hidden>
          <button class="tag-filter active" data-tag="" data-i18n="allTags">全部</button>
          <button class="tag-filter" data-tag="like" data-i18n="tagLike">喜欢</button>
          <button class="tag-filter" data-tag="later" data-i18n="tagLater">回头再看</button>
          <button id="export-saved" class="text-button" data-i18n="exportLinks">导出链接清单</button>
        </div>
        <div id="round-bar" class="round-bar" hidden>
          <span id="round-label" class="round-label"></span>
          <button id="shuffle-round" class="shuffle-button" type="button" data-i18n="shuffleRound">换一批 ↻</button>
        </div>
        <button id="updates" class="updates" hidden>有新内容 · 刷新</button>
        <div id="feed" class="feed"></div>
        <div class="feed-footer">
          <p id="feed-error" class="error" role="alert" hidden></p>
          <p id="feed-status" role="status"></p>
          <button id="load-more" hidden>加载更多</button>
        </div>
      </section>
      <div class="sash" data-sash="feed" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="resizeFeed" data-i18n-title="resizeFeed" aria-label="拖动调整文章列表宽度，双击恢复默认" title="拖动调整文章列表宽度，双击恢复默认"></div>
      <article class="detail-pane" id="detail">
        <div class="empty" data-i18n="selectArticle">从左边选一篇文章开始读</div>
      </article>
    </main>
    <dialog id="source-dialog">
      <form method="dialog" id="source-form">
        <h2 data-i18n="addSourceTitle">添加来源</h2>
        <label><span data-i18n="sourceName">名称</span><input name="name" required maxlength="200" placeholder="My favorite blog" /></label>
        <label><span data-i18n="sourceUrl">网站或 RSS/Atom 地址</span><input name="feed_url" type="url" required placeholder="https://example.com" /></label>
        <label><span data-i18n="sourceInterval">每隔多少分钟检查一次</span><input name="interval" type="number" min="5" max="43200" value="360" required /></label>
        <p id="source-form-error" class="error" role="alert" hidden></p>
        <button type="button" id="advanced-html-toggle" class="text-button" data-i18n="advancedHtml">这个网站没有 RSS，手动配置</button>
        <div id="html-config" hidden>
          <label><span data-i18n="itemSelector">文章条目选择器</span><input name="item_selector" placeholder="article.post" /></label>
          <label><span data-i18n="titleSelector">标题选择器</span><input name="title_selector" placeholder="h2 a" /></label>
          <label><span data-i18n="linkSelector">链接选择器</span><input name="link_selector" placeholder="h2 a" /></label>
          <label><span data-i18n="summarySelector">摘要选择器（可选）</span><input name="summary_selector" placeholder=".excerpt" /></label>
        </div>
        <label><span data-i18n="keywordsLabel">只要包含这些词</span><input name="keywords" placeholder="shader, rendering（留空表示都要）" /></label>
        <p class="form-note" data-i18n="keywordsHint">用逗号分开。设了关键词后，只有标题或正文里出现这些词的文章才会收进来；只有标题、没有正文的会跳过。</p>
        <p class="form-note" data-i18n="sourceFormNote">添加之后，可以在来源设置里暂停或修改。</p>
        <div class="dialog-actions"><button value="cancel" data-i18n="cancel">取消</button><button id="source-submit" value="default" data-i18n="addAndFetch">添加并抓取</button></div>
      </form>
    </dialog>
    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2 data-i18n="settingsTitle">来源设置</h2>
        <input type="hidden" name="id" />
        <label><span data-i18n="sourceName">名称</span><input name="name" required maxlength="200" /></label>
        <label><span data-i18n="sourceInterval">每隔多少分钟检查一次</span><input name="interval" type="number" min="5" max="43200" required /></label>
        <label class="check-row"><input name="enabled" type="checkbox" /><span data-i18n="autoUpdates">开启自动更新</span></label>
        <label><span data-i18n="keywordsLabel">只要包含这些词</span><input name="keywords" placeholder="shader, rendering（留空表示都要）" /></label>
        <p class="form-note" data-i18n="keywordsHint">用逗号分开。设了关键词后，只有标题或正文里出现这些词的文章才会收进来；只有标题、没有正文的会跳过。</p>
        <p id="settings-form-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions"><button value="cancel" data-i18n="cancel">取消</button><button id="settings-submit" value="default" data-i18n="save">保存</button></div>
      </form>
    </dialog>
    <dialog id="runs-dialog">
      <div class="runs-head"><h2 id="runs-title" data-i18n="fetchHistory">抓取记录</h2><button id="runs-close" class="icon-button dark" data-i18n-aria-label="close" aria-label="关闭">×</button></div>
      <div id="runs-list"><p class="empty" data-i18n="historyLoading">正在读取记录…</p></div>
    </dialog>
    <dialog id="reader-dialog" class="reader-dialog">
      <div class="reader-head"><span data-i18n="readerTitle">读文章</span><button id="reader-close" class="icon-button dark" data-i18n-aria-label="close" aria-label="关闭">×</button></div>
      <article id="reader-body" class="reader-body"></article>
    </dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <script type="module" src="/static/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
