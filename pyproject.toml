[project]
name = "gamedev-feed"
version = "0.0.0"
description = "Personal GameDev content hub. Milestone 0 is the ingestion vertical slice."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.35.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
desktop = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["server"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*", "yaml"]
ignore_missing_imports = true
